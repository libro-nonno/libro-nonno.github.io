---
layout: default
---

<section class="book-home">

  <h1>{{ site.title }}</h1>

  {% if site.subtitle %}
    <p class="book-subtitle">{{ site.subtitle }}</p>
  {% endif %}

  <p class="book-intro">
    This is a short book about <em>your topic</em>.
    It is structured in clear chapters and meant to be read sequentially.
  </p>

  <p class="book-actions">
    <a class="button" href="/chapters/">Start reading</a>
  </p>

</section>
